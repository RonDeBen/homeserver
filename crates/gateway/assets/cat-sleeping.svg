<svg xmlns="http://www.w3.org/2000/svg" width="150" height="96" viewBox="0 0 150 96">
  <!-- Smeech curled asleep on a patched indigo cushion. For the "good morning"
       card. Decorative only. -->
  <!-- cushion -->
  <g>
    <rect x="8" y="66" width="134" height="26" rx="10" fill="#243350"/>
    <rect x="8" y="66" width="134" height="26" rx="10" fill="none" stroke="#c9b98a"
          stroke-width="1.4" stroke-dasharray="6 5" opacity="0.6"/>
    <g stroke="#cdbd8e" stroke-width="1.2" opacity="0.5">
      <path d="M40 70 l6 6 M46 70 l-6 6 M104 70 l6 6 M110 70 l-6 6"/>
    </g>
  </g>
  <!-- curled body -->
  <g fill="#0c0d11">
    <path d="M40 70 C24 70 18 54 30 44 C40 36 58 34 78 36
             C104 39 122 46 124 58 C126 70 112 72 96 71
             C86 70 78 64 68 64 C58 64 50 70 40 70 Z"/>
    <!-- tail curling around -->
    <path d="M120 60 C134 58 138 68 128 71 C122 73 116 70 112 67 Z"/>
    <!-- head tucked -->
    <ellipse cx="42" cy="58" rx="15" ry="13"/>
    <path d="M31 49 l-3 -9 l10 5 Z"/>
    <path d="M50 47 l3 -9 l-11 6 Z"/>
  </g>
  <!-- closed eye -->
  <path d="M34 57 q5 4 10 0" fill="none" stroke="#e6a63c" stroke-width="1.6" stroke-linecap="round"/>
</svg>
