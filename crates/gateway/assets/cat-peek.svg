<svg xmlns="http://www.w3.org/2000/svg" width="120" height="70" viewBox="0 0 120 70">
  <!-- Smeech peeking over the bottom edge of a card: ears, head, two eyes,
       two paws hooked over the rim. Anchored to the bottom of its box. -->
