[workspace]
resolver = "2"
members = ["crates/common", "crates/calendar", "crates/hsctl", "crates/orchestrator"]

[workspace.package]
edition = "2021"

# Shared dependency versions — jobs pull these via `dep.workspace = true`
# so every crate stays on one version of tokio/sqlx/nats.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-nats = "0.38"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
cron = "0.12"
toml = "0.8"
humantime = "2"
