[workspace]
resolver = "2"
members = ["crates/common", "crates/calendar", "crates/hsctl", "crates/orchestrator", "crates/health", "crates/gateway"]

[workspace.package]
edition = "2021"

# Shared dependency versions — jobs pull these via `dep.workspace = true`
# so every crate stays on one version of tokio/sqlx/nats.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-nats = "0.38"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
cron = "0.12"
toml = "0.8"
humantime = "2"
# Calendar source ingestion: HTTP fetch + per-format parsers.
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
] }
ical = "0.11"
feed-rs = "2"
scraper = "0.21"
chrono-tz = "0.10"
regex = "1"
# Gateway (web/API surface): HTTP server, HTML templating, hypermedia live push.
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
maud = "0.26"
datastar = { version = "0.3", features = ["axum"] }
async-stream = "0.3"
http = "1"
subtle = "2"
# Embed the vendored boro asset tree into the binary (single-binary deploy).
include_dir = "0.7"
