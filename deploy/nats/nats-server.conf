# Single-node NATS for the home server.

server_name: homeserver-nats

# Monitoring / health endpoint: http://localhost:8222
http_port: 8222

# Durable streams, KV, and object store. Also a prerequisite for MQTT below.
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 2GB
}

# MQTT interface for IoT devices (smart bulbs, motion/moisture sensors).
# Off the critical path today — your Rust/Python services speak NATS on 4222.
# Devices that only speak MQTT connect here on 1883, same broker.
mqtt {
  port: 1883
}
